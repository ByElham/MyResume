# ==============================================================================
# GitHub Actions Workflow: Deploy to GitHub Pages
# ==============================================================================
# Purpose     : Automatically build the Vite/React static site and deploy it
#               to GitHub Pages on every push to the `main` branch.
# Architecture: Uses the official GitHub Pages actions with OIDC authentication.
#               No personal tokens or extra secrets are required.
# ==============================================================================

name: Deploy to GitHub Pages

# ------------------------------------------------------------------------------
# Trigger: run on every push to the main branch.
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - main

# ------------------------------------------------------------------------------
# Permissions: minimal required for Pages deployment with OIDC.
# ------------------------------------------------------------------------------
permissions:
  contents: read
  pages: write
  id-token: write

# ------------------------------------------------------------------------------
# Concurrency: cancel outdated in-progress runs to save resources.
# ------------------------------------------------------------------------------
concurrency:
  group: 'pages'
  cancel-in-progress: true

# ------------------------------------------------------------------------------
# Job: build and deploy in one unified pipeline.
# ------------------------------------------------------------------------------
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 2. Setup Node.js
      #    Note: caching is disabled because no lockfile is committed.
      #    If a lockfile is added later, enable `cache: 'npm'` and switch to `npm ci`.
      # ------------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ------------------------------------------------------------------------
      # 3. Install dependencies (using `npm install` since no lockfile exists)
      # ------------------------------------------------------------------------
      - name: Install dependencies
        run: npm install

      # ------------------------------------------------------------------------
      # 4. Build static production bundle → ./dist
      # ------------------------------------------------------------------------
      - name: Build static site
        run: npm run build

      # ------------------------------------------------------------------------
      # 5. Configure GitHub Pages and ENABLE it for this repository
      #    The `enablement: true` flag ensures Pages is turned on,
      #    preventing the "Get Pages site failed" error.
      # ------------------------------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      # ------------------------------------------------------------------------
      # 6. Upload the build output as a Pages deployment artifact
      # ------------------------------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # ------------------------------------------------------------------------
      # 7. Deploy to GitHub Pages (this step uses OIDC, no token required)
      # ------------------------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
