<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_09interlakenjungfraujochsvg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <pattern id="grid_09interlakenjungfraujochsvg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad_09interlakenjungfraujochsvg)" />
  <rect width="800" height="480" fill="url(#grid_09interlakenjungfraujochsvg)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="180" r="220" fill="#7dd3fc" opacity="0.18" filter="blur(40px)" />

  <!-- Central Symbol / Illustration -->
  <g transform="translate(0, -10)">
    <polygon points="400,90 200,280 600,280" fill="#e0f2fe"/>
      <polygon points="300,130 150,280 450,280" fill="#bae6fd" opacity="0.8"/>
      <polygon points="500,130 350,280 650,280" fill="#bae6fd" opacity="0.8"/>
      <circle cx="400" cy="80" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
      <rect x="370" y="170" width="60" height="30" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Top Badge -->
  <rect x="36" y="32" width="240" height="32" rx="16" fill="#000000" fill-opacity="0.4" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="48" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.5">JUNGFRAU • BERNER OBERLAND</text>

  <!-- Swiss Flag icon in top-right -->
  <rect x="724" y="32" width="40" height="32" rx="6" fill="#da291c" />
  <rect x="740" y="38" width="8" height="20" fill="#ffffff" />
  <rect x="734" y="44" width="20" height="8" fill="#ffffff" />

  <!-- Bottom Details Gradient Box -->
  <rect x="0" y="350" width="800" height="130" fill="url(#bgGrad_09interlakenjungfraujochsvg)" opacity="0.95" />
  <rect x="0" y="350" width="800" height="1" fill="#ffffff" opacity="0.1" />

  <text x="40" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Jungfraujoch — Top of Europe & Glacier</text>
  <text x="40" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#d4d4d8">Interlaken & High Alpine Research Observatory</text>
  <text x="40" y="452" font-family="monospace" font-size="12" fill="#7dd3fc">/media/blog/switzerland-dream/09-interlaken-jungfraujoch.jpg</text>
