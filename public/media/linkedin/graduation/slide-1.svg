<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#151520"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad1)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="200" r="180" fill="#4338ca" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1000" cy="700" r="220" fill="#d97706" opacity="0.15" filter="url(#glow)"/>

  <!-- Outer Frame -->
  <rect x="50" y="50" width="1100" height="800" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="70" y="70" width="1060" height="760" rx="18" fill="none" stroke="rgba(245,158,11,0.25)" stroke-dasharray="8,8" stroke-width="1.5"/>

  <!-- Top Badge -->
  <g transform="translate(600, 150)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="0" y="6" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="2">🎓 GRADUATION MILESTONE</text>
  </g>

  <!-- Central Emblem: Mortarboard & Laurel -->
  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="75" fill="rgba(79,70,229,0.2)" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Mortarboard Icon -->
    <path d="M-45,-15 L0,-35 L45,-15 L0,5 Z" fill="url(#goldGrad)"/>
    <path d="M-30,-5 L-30,22 C-30,35 30,35 30,22 L30,-5" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M25,-3 L38,15 L38,30" fill="none" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="33" r="4" fill="#FCD34D"/>
  </g>

  <!-- Title & Rank Announcement -->
  <text x="600" y="450" fill="#FFFFFF" font-family="'Fraunces', Georgia, serif" font-size="44" font-weight="800" text-anchor="middle">Bachelor of Science in Computer Engineering</text>
  <text x="600" y="510" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" text-anchor="middle" letter-spacing="1">Rank #1 Valedictorian • Cohort of 72+ Students</text>

  <!-- GPA and Institution -->
  <text x="600" y="570" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" text-anchor="middle">Shiraz University • Cumulative GPA: 19.20 / 20.00</text>

  <!-- Divider -->
  <line x1="400" y1="620" x2="800" y2="620" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Slide Footer Meta -->
  <g transform="translate(600, 680)">
    <rect x="-220" y="-22" width="440" height="44" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="0" y="6" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" text-anchor="middle">LinkedIn Slide 01 • Academic Excellence & Honor</text>
  </g>

  <!-- Upload Guide Prompt -->
  <text x="600" y="780" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">Drop your original image as /public/media/linkedin/graduation/slide-1.jpg</text>
</svg>
