<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGrad3)"/>

  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
  </g>

  <circle cx="950" cy="700" r="220" fill="#059669" opacity="0.2" filter="url(#glow3)"/>
  <circle cx="250" cy="250" r="180" fill="#0284c7" opacity="0.22" filter="url(#glow3)"/>

  <rect x="50" y="50" width="1100" height="800" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="70" y="70" width="1060" height="760" rx="18" fill="none" stroke="rgba(52,211,153,0.25)" stroke-dasharray="8,8" stroke-width="1.5"/>

  <!-- Top Badge -->
  <g transform="translate(600, 150)">
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1.5"/>
    <text x="0" y="6" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2">🚀 THE JOURNEY CONTINUES</text>
  </g>

  <!-- Central Target / Horizon Emblem -->
  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="75" fill="rgba(16,185,129,0.15)" stroke="url(#emeraldGrad)" stroke-width="3"/>
    <!-- Rocket / Horizon Arrow -->
    <path d="M0,-42 L18,-15 L8,-15 L8,25 L-8,25 L-8,-15 L-18,-15 Z" fill="url(#emeraldGrad)"/>
    <circle cx="0" cy="-2" r="5" fill="#FFFFFF"/>
  </g>

  <text x="600" y="450" fill="#FFFFFF" font-family="'Fraunces', Georgia, serif" font-size="40" font-weight="800" text-anchor="middle">Next Horizon: AI Research & Global Impact</text>
  <text x="600" y="510" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Deep Learning • Computer Vision • Multilingual RAG</text>

  <text x="600" y="570" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" text-anchor="middle">Advancing into Pioneer AI Research Labs worldwide</text>

  <line x1="400" y1="620" x2="800" y2="620" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <g transform="translate(600, 680)">
    <rect x="-220" y="-22" width="440" height="44" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="0" y="6" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" text-anchor="middle">LinkedIn Slide 03 • Future Visions & Research Horizons</text>
  </g>

  <text x="600" y="780" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">Drop your original image as /public/media/linkedin/graduation/slide-3.jpg</text>
</svg>
