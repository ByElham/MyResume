<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#31102b"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGrad2)"/>

  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
  </g>

  <circle cx="950" cy="250" r="190" fill="#e11d48" opacity="0.22" filter="url(#glow2)"/>
  <circle cx="250" cy="680" r="200" fill="#4338ca" opacity="0.2" filter="url(#glow2)"/>

  <rect x="50" y="50" width="1100" height="800" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="70" y="70" width="1060" height="760" rx="18" fill="none" stroke="rgba(251,113,133,0.25)" stroke-dasharray="8,8" stroke-width="1.5"/>

  <!-- Top Badge -->
  <g transform="translate(600, 150)">
    <rect x="-160" y="-24" width="320" height="48" rx="24" fill="rgba(244,63,94,0.15)" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="0" y="6" fill="#FDA4AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2">🌟 4 YEARS OF DEDICATION</text>
  </g>

  <!-- Central Academic Achievement Circles -->
  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="75" fill="rgba(225,29,72,0.15)" stroke="url(#roseGrad)" stroke-width="3"/>
    <!-- Award Laurel Icon -->
    <path d="M-30,20 C-45,-5 -35,-35 0,-40 C35,-35 45,-5 30,20" fill="none" stroke="url(#roseGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-20,15 C-30,-2 -22,-22 0,-26 C22,-22 30,-2 20,15" fill="none" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-5" r="14" fill="url(#goldGrad2)"/>
  </g>

  <text x="600" y="450" fill="#FFFFFF" font-family="'Fraunces', Georgia, serif" font-size="40" font-weight="800" text-anchor="middle">Academic Journey & Lifelong Mentorship</text>
  <text x="600" y="510" fill="#FDA4AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Guidance from Professors • Collaboration with Peers</text>

  <text x="600" y="570" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" text-anchor="middle">Transforming Theoretical Rigor into Foundational AI Research</text>

  <line x1="400" y1="620" x2="800" y2="620" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <g transform="translate(600, 680)">
    <rect x="-220" y="-22" width="440" height="44" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="0" y="6" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" text-anchor="middle">LinkedIn Slide 02 • Gratitude & Collaborative Growth</text>
  </g>

  <text x="600" y="780" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">Drop your original image as /public/media/linkedin/graduation/slide-2.jpg</text>
</svg>
